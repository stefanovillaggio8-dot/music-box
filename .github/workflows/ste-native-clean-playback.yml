name: Ste native clean tail playback regression
on:
  pull_request:
    paths:
      - 'mix-intelligente.js'
      - 'dj-deep-analysis.json'
      - 'tests/native-clean*'
      - '.github/workflows/ste-native-clean-playback.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ste-native-clean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-clean:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # Keep the Linux decoder dependencies in a versioned, prebuilt image.
    # The empty macOS value means native host execution, as before.
    container: ${{ matrix.os == 'ubuntu-24.04' && 'mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f' || '' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser backends within a bounded setup budget
        timeout-minutes: 4
        env:
          npm_config_fetch_timeout: '60000'
          npm_config_fetch_retries: '1'
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          if [ "$RUNNER_OS" = "Linux" ]; then
            node -e "const fs=require('fs'),p=require('playwright');for(const b of [p.chromium,p.webkit])if(!fs.existsSync(b.executablePath()))throw Error('Pinned native browser missing')"
          else
            npx playwright install --with-deps chromium webkit
          fi
      - name: Provide Linux native media output
        if: runner.os == 'Linux'
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          # Container HOME is owned by the runner, not PulseAudio. Use an
          # isolated system-mode socket rather than changing HOME or relying
          # on user autospawn. No sound device or user storage is exposed.
          install -d -o pulse -g pulse /run/pulse
          pulseaudio --system --daemonize --disallow-exit --exit-idle-time=-1 \
            --log-target=file:/tmp/ste-native-pulse.log \
            --load="module-native-protocol-unix socket=/tmp/ste-native-pulse auth-anonymous=1" \
            --load="module-null-sink sink_name=musicbox_clean rate=48000 channels=2"
          echo "PULSE_SERVER=unix:/tmp/ste-native-pulse" >> "$GITHUB_ENV"
          PULSE_SERVER=unix:/tmp/ste-native-pulse pactl set-default-sink musicbox_clean
      - name: Verify only the two current personal Ste original fixtures
        run: node tools/fetch-ste-clean-evaluation.cjs audits/ste-classifier-evaluation-20261123/native-element-shadow.json
      - name: Verify the newly installed Ste pair originals
        run: node tools/fetch-ste-clean-evaluation.cjs audits/ste-factored-clean-20261123/new-pair-shadow.json
      - name: Two newly installed Ste original fixtures only
        run: |
          node tools/fetch-ste-clean-evaluation.cjs audits/ste-next-clean-20261123/new-pair-shadow.json
          node tools/fetch-ste-clean-evaluation.cjs audits/ste-source6-quiet-20261123/new-pair-shadow.json
      - name: Check class, queue, seek and preserved controls
        run: node --test tests/native-clean-launch-window.test.cjs tests/native-eof-ownership.test.cjs tests/quiet-native-continuation.test.cjs tests/mobile-unconsumed-prefix.test.cjs tests/native-clean-level-reference.test.cjs tests/native-clean-tail.test.cjs tests/factored-native-clean.test.cjs tests/factored-clean-candidate.test.cjs tests/structural-plans.test.cjs tests/dj-shuffle-fallback.test.cjs
      - name: Exercise ACTUAL release index without shadow injection
        env:
          MUSICBOX_NATIVE_CLEAN_OUTPUT: native-clean-release-player.json
          MUSICBOX_NATIVE_TRANSLATION: 'true'
        run: node tests/native-clean-browser.cjs
      - name: Proven quiet suffix tolerates a delayed main-thread turn without consuming the intro
        env:
          MUSICBOX_NATIVE_CUE_STALL: 'true'
          MUSICBOX_NATIVE_CLEAN_OUTPUT: native-clean-delayed-player.json
        run: node tests/native-clean-browser.cjs
      - name: New installed natural junction, no shadow injection
        env:
          MUSICBOX_NATIVE_CLEAN_FIXTURE: audits/ste-factored-clean-20261123/new-pair-shadow.json
          MUSICBOX_NATIVE_CLEAN_OUTPUT: factored-clean-release-player.json
        run: node tests/native-clean-browser.cjs
      - name: New installed Gilgamesh to Eva, actual release index
        env:
          MUSICBOX_NATIVE_CLEAN_FIXTURE: audits/ste-next-clean-20261123/new-pair-shadow.json
          MUSICBOX_NATIVE_CLEAN_OUTPUT: gilgamesh-eva-installed.json
        run: node tests/native-clean-browser.cjs
      - name: New installed second source, actual release index
        env:
          MUSICBOX_NATIVE_CLEAN_FIXTURE: audits/ste-source6-quiet-20261123/new-pair-shadow.json
          MUSICBOX_NATIVE_CLEAN_OUTPUT: mashup-eva-installed.json
        run: node tests/native-clean-browser.cjs
      - name: Three newly installed Il Filmografo junctions, no shadow injection
        run: |
          for id in 4 34 50; do
            fixture="audits/ste-filmografo-quiet-20261124/track-${id}-shadow.json"
            node tools/fetch-ste-clean-evaluation.cjs "$fixture"
            MUSICBOX_NATIVE_CLEAN_FIXTURE="$fixture" MUSICBOX_NATIVE_CLEAN_OUTPUT="filmografo-${id}-installed.json" node tests/native-clean-browser.cjs
          done
      - name: Actual Safari path keeps the primary native player and unconsumed intro
        env:
          MUSICBOX_PHONE_NATIVE_INTRO: 'true'
          MUSICBOX_NATIVE_CLEAN_FIXTURE: audits/ste-factored-clean-20261123/new-pair-shadow.json
          MUSICBOX_NATIVE_CLEAN_OUTPUT: safari-native-intro-installed.json
        run: node tests/native-clean-browser.cjs
      - name: Four new installed Kid Yugi clean junctions, no shadow injection
        run: |
          node --test tests/ste-kidyugi-clean-prefixes.test.cjs
          for id in 33 87 1187 138; do
            fixture="audits/ste-kidyugi-prefixes-6744/track-${id}-shadow.json"
            node tools/fetch-ste-clean-evaluation.cjs "$fixture"
            MUSICBOX_NATIVE_CLEAN_FIXTURE="$fixture" MUSICBOX_NATIVE_CLEAN_OUTPUT="kidyugi-${id}-installed.json" node tests/native-clean-browser.cjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ste-native-clean-release-${{ runner.os }}
          path: |
            kidyugi-*-installed.json
            gilgamesh-eva-installed.json
            mashup-eva-installed.json
            safari-native-intro-installed.json
            filmografo-4-installed.json
            filmografo-34-installed.json
            filmografo-50-installed.json
            native-clean-release-player.json
            native-clean-delayed-player.json
            factored-clean-release-player.json
