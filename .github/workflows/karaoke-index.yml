name: Indicizza karaoke disponibili (solo ID)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build-karaoke-index.cjs
      - .github/workflows/karaoke-index.yml
permissions:
  contents: write
concurrency:
  group: musicbox-karaoke-metadata
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cerca testi LRC e salva solo gli ID (non i testi)
        env:
          MAX_KARAOKE_LOOKUP: "1050"
        run: node tools/build-karaoke-index.cjs
      - name: Pubblica indice metadati senza perdere modifiche concorrenti
        run: |
          # Un'altra pubblicazione può avvenire mentre la scansione è in corso.
          # Conserva il nuovo indice, riparti dal main più recente e unisci.
          cp karaoke-index.json "$RUNNER_TEMP/musicbox-karaoke-new.json"
          git fetch origin main
          git reset --hard origin/main
          node - <<'NODE'
          const fs = require('fs');
          let published = {};
          try { published = JSON.parse(fs.readFileSync('karaoke-index.json','utf8')); } catch (_) {}
          const found = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/musicbox-karaoke-new.json','utf8'));
          const merged = {...published, ...found};
          fs.writeFileSync('karaoke-index.json',JSON.stringify(Object.fromEntries(Object.entries(merged).sort()),null,2)+'\n');
          console.log('Karaoke ID pubblicabili:',Object.keys(merged).length);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add karaoke-index.json
          if git diff --staged --quiet; then
            echo "Nessun nuovo ID LRCLIB"; exit 0
          fi
          git commit -m "Indicizza testi karaoke tramite ID LRCLIB"
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
