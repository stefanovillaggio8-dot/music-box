name: Desktop DJ Chromium playback smoke
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'mix-intelligente.js'
      - 'index.html'
      - 'tests/desktop-chromium-smoke.cjs'
      - '.github/workflows/desktop-chromium-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-dj:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Verify real Chromium audio preview and seamless handoff
        run: node tests/desktop-chromium-smoke.cjs
