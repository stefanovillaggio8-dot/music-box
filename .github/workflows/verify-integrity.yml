name: Verifica integrita Music Box
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.js
      - sw.js
      - spotify.js
      - spotify-ui.js
      - fuoco.js
      - versione.json
      - covers.json
      - covers-spotify.json
      - lyrics.json
      - karaoke-index.json
      - tools/audit-catalog.cjs
      - tools/test-audio-routing.cjs
      - tools/test-stats-profiles.cjs
      - tools/test-favorites-and-listening.cjs
      - tools/test-recap-annuale.cjs
      - tools/test-background-ios.cjs
      - tools/test-offline-retention.cjs
      - tools/aggiorna-copia-locale.ps1
      - tools/ripara-musicbox-pc.ps1
      - tools/serve-private-musicbox.cjs
      - tools/test-private-server.cjs
      - .github/workflows/verify-integrity.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controlla JavaScript
        run: |
          node --check app.js
          node --check sw.js
          node --check spotify.js
          node --check spotify-ui.js
          node --check fuoco.js
      - name: Verifica server privato e supporto MP3 range
        run: |
          node --check tools/serve-private-musicbox.cjs
          node --check tools/build-karaoke-index.cjs
          node tools/test-private-server.cjs
      - name: Verifica sintassi PowerShell senza toccare i brani
        shell: pwsh
        run: |
          $paths = @("tools/aggiorna-copia-locale.ps1", "tools/ripara-musicbox-pc.ps1", "tools/verifica-audio-sul-pc.ps1")
          foreach ($file in $paths) {
            $tokens = $null
            $issues = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$issues)
            if ($issues.Count -gt 0) {
              $issues | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax error in $file"
            }
          }
      - name: Prova aggiornamento locale su cartella isolata senza toccare musica
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "musicbox-test-local"
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $testRoot "songs") -Force | Out-Null
          Copy-Item app.js, index.html -Destination $testRoot
          '{"b-local-only":{"lrclibId":123456789,"synced":true}}' | Set-Content (Join-Path $testRoot "karaoke-index.json")
          '{"b-local-only":{"text":"do not overwrite local text"}}' | Set-Content (Join-Path $testRoot "lyrics.json")
          [IO.File]::WriteAllBytes((Join-Path $testRoot "songs\private-test.mp3"), [byte[]]::new(8192))
          & ./tools/aggiorna-copia-locale.ps1 -Root $testRoot
          $index = Get-Content (Join-Path $testRoot "karaoke-index.json") -Raw | ConvertFrom-Json
          $version = Get-Content (Join-Path $testRoot "versione.json") -Raw | ConvertFrom-Json
          $lyrics = Get-Content (Join-Path $testRoot "lyrics.json") -Raw
          if (-not $index.'b-local-only'.synced) { throw "ID karaoke locale perso" }
          if ($version.brani -lt 1072) { throw "Catalogo incompleto" }
          if ($lyrics -notmatch 'do not overwrite local text') { throw "Testi locali sovrascritti" }
          if (-not (Test-Path (Join-Path $testRoot "songs\private-test.mp3"))) { throw "Audio privato perso" }
          Write-Host "Aggiornamento locale testato senza perdere audio, testi o ID karaoke"
      - name: Testa sorgenti audio PC e GitHub senza contenuti misti HTTP/HTTPS
        run: node tools/test-audio-routing.cjs
      - name: Verifica cataloghi, profili, immagini e indice karaoke
        run: node tools/audit-catalog.cjs
      - name: Verifica conteggi statistiche tra tutti i profili
        run: node tools/test-stats-profiles.cjs
      - name: Verifica preferiti persistenti, pause e seek
        run: node tools/test-favorites-and-listening.cjs
      - name: Verifica recap 12 mesi, totale annuale e reset selettivo
        run: node tools/test-recap-annuale.cjs
      - name: Verifica gestione audio e MediaSession iOS
        run: node tools/test-background-ios.cjs
      - name: Verifica conservazione download offline e pausa Safari
        run: node tools/test-offline-retention.cjs
