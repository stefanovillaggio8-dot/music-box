jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real offline-shell regression browser
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps webkit
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check mix-intelligente.js
          node --check voice-analysis.js
          node --check dj-vocal-stem-runtime.js
          node --check tools/build-dj-lyric-boundaries.cjs
          python -m py_compile tools/dj-vocal-stem.py
          python tools/test-dj-vocal-stem.py
          node --check audio-lyrics-align.js
          node --check audio-lyrics-worker.js
          node --check word-karaoke.js
          node --check immersive.js
      - name: Test DJ transition safety
        run: node --test tests/*.test.cjs
      - name: Preserve saved music and personal data through a real worker update
        run: node tests/offline-upgrade.cjs
