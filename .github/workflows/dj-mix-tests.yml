name: DJ Mix regression tests
on:
  push:
    paths:
      - 'mix-intelligente.js'
      - 'voice-analysis.js'
      - 'tests/voice-analysis.test.cjs'
      - 'tests/harmonic-transitions.test.cjs'
      - 'app.js'
      - 'tests/dj-mix.test.cjs'
      - 'tests/dj-musical-release.test.cjs'
      - 'tests/dj-shuffle-fallback.test.cjs'
      - 'tests/dj-real-library.test.cjs'
      - 'dj-deep-analysis.json'
      - 'tests/dj-deep-integration.test.cjs'
      - '.github/workflows/dj-mix-tests.yml'
  pull_request:
    paths:
      - 'mix-intelligente.js'
      - 'voice-analysis.js'
      - 'tests/voice-analysis.test.cjs'
      - 'tests/harmonic-transitions.test.cjs'
      - 'app.js'
      - 'tests/dj-mix.test.cjs'
      - 'tests/dj-musical-release.test.cjs'
      - 'tests/dj-shuffle-fallback.test.cjs'
      - 'tests/dj-real-library.test.cjs'
      - 'dj-deep-analysis.json'
      - 'tests/dj-deep-integration.test.cjs'
      - '.github/workflows/dj-mix-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check mix-intelligente.js
          node --check voice-analysis.js
      - name: Test DJ transition safety
        run: node --test tests/dj-mix.test.cjs tests/voice-analysis.test.cjs tests/harmonic-transitions.test.cjs tests/dj-musical-release.test.cjs tests/dj-deep-integration.test.cjs tests/dj-shuffle-fallback.test.cjs tests/dj-real-library.test.cjs
