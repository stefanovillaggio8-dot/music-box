name: Native original MP3 metadata diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-metadata:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MUSICBOX_COMPOSITE_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps ${{ matrix.browser }}
          node tests/native-source-metadata.cjs > native-source-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-source-metadata-${{ matrix.browser }}
          path: native-source-metadata.json
          retention-days: 14
