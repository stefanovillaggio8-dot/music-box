name: Music Box - importa da telefono senza account GitHub
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/process-mobile-imports.yml"]
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: write
  id-token: write
concurrency:
  group: musicbox-mobile-import-worker
  cancel-in-progress: false
jobs:
  cloud-import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prova pubblica dal telefono senza login (solo link non valido)
        if: github.event_name == 'push'
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
            const r = await fetch("https://adnteitlhopehllutlua.supabase.co/functions/v1/musicbox-import-queue", {
              method: "POST",
              headers: {"content-type":"application/json","origin":"https://stefanovillaggio8-dot.github.io"},
              body: JSON.stringify({action:"create",link:"https://example.org/invalid",
                profile:"TestNoLogin",title:"non reale",rights:true})
            });
            const data = await r.json();
            if (r.status!==400 || data.ok!==false) {
              throw Error("L'API pubblica non ha rifiutato il link esterno: "+JSON.stringify(data));
            }
            console.log("OK: invio senza GitHub login raggiungibile e link estraneo rifiutato");
            const list=await fetch("https://adnteitlhopehllutlua.supabase.co/functions/v1/musicbox-import-queue?action=links&profile=Ste",{
              headers:{"origin":"https://stefanovillaggio8-dot.github.io"}
            });
            const result=await list.json();
            if(!list.ok||result.ok!==true||!Array.isArray(result.links))
              throw Error("Elenco link profilo non disponibile: "+JSON.stringify(result));
            console.log("OK: elenco link disponibile senza login GitHub, elementi="+result.links.length);
          })().catch(e => {console.error(e);process.exit(1);});
          NODE
      - name: Controlla convertitore e sorgente CC0
        run: |
          node --check tools/import-youtube-online.cjs
          node --check tools/resolve-licensed-audio.cjs
          node --check tools/cobalt-audio-fallback.cjs
          node tools/test-licensed-audio.cjs
      - name: Prendi una richiesta dalla coda Supabase usando OIDC firmato
        id: claim
        run: node tools/cloud-queue-client.cjs claim
      - name: Python 3.12
        if: steps.claim.outputs.has_job == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa Deno per supporto YouTube aggiornato
        if: steps.claim.outputs.has_job == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Installa conversione sul server GitHub
        if: steps.claim.outputs.has_job == 'true'
        run: |
          python -m pip install --upgrade "yt-dlp[default]"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -version | head -n 1
          yt-dlp --version
          echo "YouTube audio: client default + android_vr (solo contenuti autorizzati)"
      - name: Avvia convertitore Cobalt isolato sul runner
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          # Servizio accessibile SOLO da questo runner, non da internet.
          # Se l'immagine non parte, rimane disponibile il motore yt-dlp.
          if docker run --detach --rm --name musicbox-cobalt \
               --publish 127.0.0.1:9000:9000 \
               --env API_URL=http://127.0.0.1:9000/ \
               --env DURATION_LIMIT=720 \
               ghcr.io/imputnet/cobalt:11; then
            echo "Cobalt avviato sul runner"
          else
            echo "Cobalt non disponibile; usero' yt-dlp"
          fi
          for i in $(seq 1 12); do
            if curl --silent --fail --max-time 3 http://127.0.0.1:9000/ >/dev/null; then
              echo "Cobalt locale pronto"
              break
            fi
            sleep 2
          done
      - name: Riutilizza MP3 gia pubblicato per evitare richieste duplicate
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/musicbox-cloud-job.json","utf8"));if(!/^[A-Za-z0-9_-]{11}$/.test(j.video_id))process.exit(1);process.stdout.write("songs/youtube-"+j.video_id+".mp3")')
          if git fetch --no-tags origin mobile-audio && git cat-file -e "FETCH_HEAD:$FILE" 2>/dev/null; then
            mkdir -p songs
            git show "FETCH_HEAD:$FILE" > "$FILE"
            test -s "$FILE"
            echo "MP3 gia' pubblicato: riutilizzo il file senza riconvertire"
          else
            echo "Nessun MP3 precedente: procedo con conversione autorizzata"
          fi
      - name: Converti unicamente contenuto autorizzato
        if: steps.claim.outputs.has_job == 'true'
        id: convert
        env:
          MB_IMPORT_JSON_PATH: ${{ runner.temp }}/musicbox-cloud-job.json
        run: node tools/import-youtube-online.cjs
      - name: Pubblica MP3 in archivio separato e aggiorna indice su main
        if: steps.claim.outputs.has_job == 'true' && steps.convert.outcome == 'success'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/musicbox-cloud-job.json","utf8"));if(!/^[A-Za-z0-9_-]{11}$/.test(j.video_id))process.exit(1);process.stdout.write("songs/youtube-"+j.video_id+".mp3")')
          test -s "$FILE"
          git fetch origin mobile-audio
          git worktree add -B mobile-audio "$RUNNER_TEMP/mb-audio" origin/mobile-audio
          mkdir -p "$RUNNER_TEMP/mb-audio/songs"
          cp "$FILE" "$RUNNER_TEMP/mb-audio/$FILE"
          (
            cd "$RUNNER_TEMP/mb-audio"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f -- "$FILE"
            if ! git diff --cached --quiet; then
              git commit -m "Music Box: aggiungi MP3 autorizzato in archivio audio"
              git pull --rebase origin mobile-audio
              git push origin HEAD:mobile-audio
            fi
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- online-imports.json
          if ! git diff --cached --quiet; then
            git commit -m "Music Box: aggiorna indice per importazione da telefono"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Verifica file MP3 e indice su GitHub dopo la pubblicazione
        if: steps.claim.outputs.has_job == 'true' && steps.publish.outcome == 'success'
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/musicbox-cloud-job.json","utf8"));if(!/^[A-Za-z0-9_-]{11}$/.test(j.video_id))process.exit(1);process.stdout.write("songs/youtube-"+j.video_id+".mp3")')
          git fetch --no-tags origin '+refs/heads/mobile-audio:refs/remotes/origin/mobile-audio' '+refs/heads/main:refs/remotes/origin/main'
          git cat-file -e "refs/remotes/origin/mobile-audio:$FILE"
          FILE="$FILE" node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const target = process.env.FILE;
          const job = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/musicbox-cloud-job.json','utf8'));
          const raw = execFileSync('git',['show','refs/remotes/origin/main:online-imports.json'],{encoding:'utf8'});
          const data = JSON.parse(raw);
          if (!Array.isArray(data) || !data.some(x=>x.file===target && x.profile===job.profile)) {
            throw Error('Indice online mancante per ' + target + ' e profilo ' + job.profile);
          }
          console.log('MP3 e indice verificati su GitHub per',job.profile,target);
          NODE
      - name: Arresta convertitore isolato
        if: always() && steps.claim.outputs.has_job == 'true'
        run: docker rm -f musicbox-cobalt >/dev/null 2>&1 || true
      - name: Comunica risultato al servizio cloud
        if: always() && steps.claim.outputs.has_job == 'true'
        run: |
          if [ "${{ steps.convert.outcome }}" = 'success' ] && [ "${{ steps.publish.outcome }}" = 'success' ] && [ "${{ steps.verify.outcome }}" = 'success' ]; then
            node tools/cloud-queue-client.cjs finish success
          else
            node tools/cloud-queue-client.cjs finish failed
          fi
