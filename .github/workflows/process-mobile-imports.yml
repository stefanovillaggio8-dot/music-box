name: Music Box - importa da telefono senza account GitHub
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  id-token: write
concurrency:
  group: musicbox-mobile-import-worker
  cancel-in-progress: false
jobs:
  cloud-import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prendi una richiesta dalla coda Supabase usando OIDC firmato
        id: claim
        run: node tools/cloud-queue-client.cjs claim
      - name: Python 3.12
        if: steps.claim.outputs.has_job == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa conversione sul server GitHub
        if: steps.claim.outputs.has_job == 'true'
        run: |
          python -m pip install --upgrade "yt-dlp[default]"
          ffmpeg -version | head -n 1
      - name: Converti unicamente contenuto autorizzato
        if: steps.claim.outputs.has_job == 'true'
        id: convert
        env:
          MB_IMPORT_JSON_PATH: ${{ runner.temp }}/musicbox-cloud-job.json
        run: node tools/import-youtube-online.cjs
      - name: Pubblica MP3 in archivio separato e aggiorna indice su main
        if: steps.claim.outputs.has_job == 'true' && steps.convert.outcome == 'success'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/musicbox-cloud-job.json","utf8"));if(!/^[A-Za-z0-9_-]{11}$/.test(j.video_id))process.exit(1);process.stdout.write("songs/youtube-"+j.video_id+".mp3")')
          test -s "$FILE"
          git fetch origin mobile-audio
          git worktree add -B mobile-audio "$RUNNER_TEMP/mb-audio" origin/mobile-audio
          mkdir -p "$RUNNER_TEMP/mb-audio/songs"
          cp "$FILE" "$RUNNER_TEMP/mb-audio/$FILE"
          (
            cd "$RUNNER_TEMP/mb-audio"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f -- "$FILE"
            if ! git diff --cached --quiet; then
              git commit -m "Music Box: aggiungi MP3 autorizzato in archivio audio"
              git pull --rebase origin mobile-audio
              git push origin HEAD:mobile-audio
            fi
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- online-imports.json
          if ! git diff --cached --quiet; then
            git commit -m "Music Box: aggiorna indice per importazione da telefono"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Comunica risultato al servizio cloud
        if: always() && steps.claim.outputs.has_job == 'true'
        run: |
          if [ "${{ steps.convert.outcome }}" = 'success' ] && [ "${{ steps.publish.outcome }}" = 'success' ]; then
            node tools/cloud-queue-client.cjs finish success
          else
            node tools/cloud-queue-client.cjs finish failed
          fi
