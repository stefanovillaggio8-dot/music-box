name: Music Box - Analisi DJ reale degli MP3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/dj-deep-index.py'
      - 'tools/test-dj-deep-index.py'
      - '.github/workflows/dj-deep-index.yml'
      - 'online-imports.json'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: musicbox-dj-deep-analysis
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "librosa==0.11.0"
      - name: Verify extractor and test synthetic audio
        run: |
          python -m py_compile tools/dj-deep-index.py
          python tools/test-dj-deep-index.py
      - name: Analyze real audio in bounded batches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/dj-deep-index.py --batch 35
      - name: Save only musical metadata, never publish MP3 copies
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dj-deep-analysis.json
          if ! git diff --cached --quiet; then
            git commit -m "Music Box DJ: analisi MP3 reale, aggiornamento progressivo"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
