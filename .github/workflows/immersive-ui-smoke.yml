name: Immersive Mode Chromium layout and controls
on:
  push:
    branches: [main, feat/immersive-cinema-refresh-6646]
    paths:
      - 'immersive.js'
      - 'style.css'
      - 'index.html'
      - 'tests/immersive-ui-smoke.cjs'
      - '.github/workflows/immersive-ui-smoke.yml'
  pull_request:
    paths:
      - 'immersive.js'
      - 'word-karaoke.js'
      - 'style.css'
      - 'index.html'
      - 'tests/immersive-ui-smoke.cjs'
      - 'tests/lyrics-full-view-layout.cjs'
      - '.github/workflows/immersive-ui-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Immersive JavaScript syntax
        run: node --check immersive.js && node --check tests/immersive-ui-smoke.cjs && node --check tests/lyrics-full-view-layout.cjs
      - name: Install Chromium browser test
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          test -x /usr/bin/google-chrome
      - name: Generate and validate silent synthetic video
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -v error -f lavfi -i color=c=purple:s=32x32:r=2:d=4 -an -c:v libx264 -profile:v baseline -pix_fmt yuv420p -movflags +faststart -y /tmp/mb-video-fixture.mp4
          ffprobe -v error -show_entries stream=codec_name,duration -of compact /tmp/mb-video-fixture.mp4
          ffmpeg -v error -i /tmp/mb-video-fixture.mp4 -f null -
      - name: Test desktop and mobile viewport karaoke, controls and scrolling
        run: node tests/immersive-ui-smoke.cjs
      - name: Test full lyrics reader in Chromium before installing WebKit
        run: node tests/lyrics-full-view-layout.cjs
      - name: Install WebKit for Safari-style layout verification
        run: npx playwright install --with-deps webkit
      - name: Test immersive karaoke and controls in WebKit
        env:
          IMMERSIVE_ENGINE: webkit
        run: node tests/immersive-ui-smoke.cjs
      - name: Test full lyrics reader in Chromium and WebKit
        run: node tests/lyrics-full-view-layout.cjs
