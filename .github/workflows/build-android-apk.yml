name: Build Music Box Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-apk.yml'
      - 'icon-192.png'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK (GitHub runner SDK)
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager | head -n1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android SDK manager not installed"; exit 1; fi
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare Music Box icon
        run: |
          mkdir -p android-wrapper/app/src/main/res/drawable-nodpi
          cp icon-192.png android-wrapper/app/src/main/res/drawable-nodpi/musicbox_icon.png
      - name: Build debug-signed APK
        run: gradle -p android-wrapper --no-daemon :app:assembleDebug
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk dist/MusicBox-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MusicBox-Android-APK
          path: dist/MusicBox-Android.apk
          if-no-files-found: error
          retention-days: 30
