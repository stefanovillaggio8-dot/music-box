name: iPhone DJ WebKit foreground smoke
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'mix-intelligente.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/iphone-webkit-smoke.cjs'
      - '.github/workflows/iphone-webkit-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real WebKit browser (Playwright)
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps webkit
      - name: Run live DOM and iPhone path regression in WebKit
        run: node tests/iphone-webkit-smoke.cjs
