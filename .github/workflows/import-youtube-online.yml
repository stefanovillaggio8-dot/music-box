name: Music Box - importa YouTube online (PC spento)
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: musicbox-youtube-online-import
  cancel-in-progress: false
jobs:
  import:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[MusicBox] Importa brano YouTube'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deno per YouTube
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Python per il convertitore cloud
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installazione convertitore sulla macchina GitHub, non sul PC
        run: |
          python -m pip install --upgrade "yt-dlp[default]" "bgutil-ytdlp-pot-provider==2.0.2"
          ffmpeg -version | head -n 1
      - name: Avvia PO Token provider isolato sul runner
        shell: bash
        run: |
          # Locale al runner, senza cookie o credenziali YouTube.
          if docker run --detach --rm --init --name musicbox-bgutil \
               --publish 127.0.0.1:4416:4416 \
               brainicism/bgutil-ytdlp-pot-provider:2.0.2; then
            for i in $(seq 1 20); do
              if curl --silent --max-time 3 --output /dev/null http://127.0.0.1:4416/ >/dev/null; then
                echo "MB_POT_READY=true" >> "$GITHUB_ENV"
                echo "PO Token provider pronto (solo localhost)"
                break
              fi
              sleep 1
            done
          fi
          if ! grep -q '^MB_POT_READY=true$' "$GITHUB_ENV"; then
            echo "MB_POT_READY=false" >> "$GITHUB_ENV"
            echo "PO Token provider non disponibile: fallback attivi"
          fi
      - name: Importa solo il video autorizzato
        id: import
        run: node tools/import-youtube-online.cjs
      - name: Pubblica audio e indice condiviso
        if: success() && steps.import.outputs.status == 'added'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- online-imports.json
          git add -f -- "${{ steps.import.outputs.file }}"
          git commit -m 'Music Box: aggiungi audio autorizzato da YouTube'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Arresta PO Token provider
        if: always()
        run: docker rm -f musicbox-bgutil >/dev/null 2>&1 || true
      - name: Comunica il risultato nell'issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          JOB_STATUS: ${{ job.status }}
          SONG_TITLE: ${{ steps.import.outputs.title }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            gh issue comment "$ISSUE_URL" --body "Importazione completata per **$SONG_TITLE**. Il brano viene letto direttamente da GitHub: aggiorna Music Box dopo alcuni secondi. Il PC non e' stato utilizzato."
            gh issue close "$ISSUE_URL" --reason completed
          else
            gh issue comment "$ISSUE_URL" --body "Importazione non riuscita. Apri la scheda **Actions** di questo repository per leggere l'errore. Se il video non e' accessibile a YouTube senza login o non e' autorizzato, nessun audio viene pubblicato."
          fi
