name: Common PCM mix Chromium and WebKit playback
on:
  pull_request:
    paths:
      - 'native-mp3-metadata.js'
      - 'native-mp3-metadata.json'
      - 'tests/native-metadata-pcm.cjs'
      - 'audio-composite-*.js'
      - 'audio-composite-*.mjs'
      - 'dj-mixes/**'
      - 'dj-deep-analysis.json'
      - 'app.js'
      - 'mix-intelligente.js'
      - 'audio-lyrics-align.js'
      - 'karaoke-acoustic-proof.js'
      - 'tests/karaoke-proof-browser.cjs'
      - 'tests/composite-*.cjs'
      - '.github/workflows/composite-browser.yml'
  workflow_dispatch:
    inputs:
      webkit_runner:
        description: 'Native media platform for WebKit; both platforms keep identical playback and peak checks'
        type: choice
        options: [ubuntu-latest, macos-latest, macos-26-intel]
        default: ubuntu-latest
      ste_case:
        description: 'Keep the legacy partial regression distinct from the new personal-library complete pair'
        type: choice
        options: [legacy-partial, complete-personal, observed-bars-partial, cadence-partial]
        default: complete-personal
      metadata_prefix_probe:
        description: 'Diagnostic only: add the proven metadata frame without changing original audio frame payloads'
        type: boolean
        default: false
      metadata_fixture_transport:
        description: 'Diagnostic A/B control: fulfill identical original bytes over the same transport used by the prefix probe'
        type: boolean
        default: false
      native_unique_url_probe:
        description: 'Diagnostic only: same original bytes with a distinct URL for each source assignment'
        type: boolean
        default: false
      playback_repetitions:
        description: 'Independent real-app playback trials per browser; all must pass'
        type: choice
        options: ['1', '3']
        default: '1'
      gstreamer_debug:
        description: 'Linux WebKit backend trace only; no application workaround'
        type: boolean
        default: false
      diagnostic_ste_only:
        description: 'Restrict real-app diagnostics to WebKit Ste; does not replace the full browser matrix'
        type: boolean
        default: false
      linux_virtual_audio:
        description: 'Use an operating Linux media output; disable only for the explicit no-device control'
        type: boolean
        default: true
      inject_provisional_metadata:
        description: 'Separate fault-injection integration test; never a normal native playback certificate'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-decoders:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ${{ matrix.browser == 'webkit' && inputs.webkit_runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      MUSICBOX_COMPOSITE_BROWSERS: ${{ matrix.browser }}
      GST_DEBUG: '2'
      GST_DEBUG_FILE: ${{ github.workspace }}/native-gstreamer-%p.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start isolated Linux audio output for native media metadata
        if: runner.os == 'Linux' && matrix.browser == 'webkit' && (github.event_name != 'workflow_dispatch' || inputs.linux_virtual_audio)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1 --log-target=file:/tmp/musicbox-native-pulse.log
          pactl load-module module-null-sink sink_name=musicbox_native_ci rate=48000 channels=2
          pactl set-default-sink musicbox_native_ci
          pactl info > native-linux-audio-output.txt
      - run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium webkit
          node tests/native-decoder-peaks.cjs > native-decoder-peaks.json
          node tests/native-metadata-pcm.cjs > native-metadata-pcm.json
          node tests/karaoke-proof-browser.cjs > karaoke-proof-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-decoder-${{ matrix.browser }}
          path: |
            native-decoder-peaks.json
            native-metadata-pcm.json
            karaoke-proof-browser.json
            native-gstreamer-*.log
            native-linux-audio-output.txt
          retention-days: 14
  certify-index:
    needs: native-decoders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-decoder-*
          path: native-proofs
      - run: |
          mkdir certified
          node tools/apply-native-decoder-peaks.cjs --proofs=native-proofs --output=certified/dj-deep-analysis.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-certified-index
          path: certified/dj-deep-analysis.json
          retention-days: 14
  real-audio:
    needs: certify-index
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.diagnostic_ste_only && '["webkit"]' || '["chromium","webkit"]') }}
        profile: ${{ fromJSON(inputs.diagnostic_ste_only && '["Ste"]' || '["Emanuele","Ste","Diego"]') }}
    runs-on: ${{ matrix.browser == 'webkit' && inputs.webkit_runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      MUSICBOX_COMPOSITE_BROWSERS: ${{ matrix.browser }}
      MUSICBOX_COMPOSITE_PROFILE: ${{ matrix.profile }}
      MUSICBOX_STE_CASE: ${{ inputs.ste_case || 'complete-personal' }}
      MUSICBOX_METADATA_PREFIX_PROBE: ${{ inputs.metadata_prefix_probe || false }}
      MUSICBOX_METADATA_FIXTURE_TRANSPORT: ${{ inputs.metadata_fixture_transport || false }}
      MUSICBOX_INJECT_PROVISIONAL_METADATA: ${{ inputs.inject_provisional_metadata || false }}
      MUSICBOX_NATIVE_UNIQUE_URL_PROBE: ${{ inputs.native_unique_url_probe || false }}
      MUSICBOX_COMPOSITE_REPETITIONS: ${{ inputs.playback_repetitions || '1' }}
      GST_DEBUG: ${{ inputs.gstreamer_debug && matrix.browser == 'webkit' && '2,mpegaudioparse:6,playbin:4,playbin3:4,webkit*:5' || '' }}
      GST_DEBUG_FILE: ${{ github.workspace }}/gstreamer-${{ matrix.profile }}-%p.log
      GST_DEBUG_NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium webkit
      - name: Start isolated Linux audio output for the controlled diagnostic
        if: runner.os == 'Linux' && matrix.browser == 'webkit' && (github.event_name != 'workflow_dispatch' || inputs.linux_virtual_audio)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1 --log-target=file:/tmp/musicbox-pulse.log
          pactl load-module module-null-sink sink_name=musicbox_ci rate=48000 channels=2
          pactl set-default-sink musicbox_ci
          pactl info | tee linux-audio-output.txt
          pactl list short sinks | tee -a linux-audio-output.txt
      - uses: actions/download-artifact@v4
        with:
          name: native-certified-index
          path: .
      - run: node --test tests/composite-mix.test.cjs
      - run: |
          set -o pipefail
          node tests/composite-browser.cjs | tee composite-browser-result.json
          node -e "const r=require('./composite-browser-result.json');if(r.results.length!==Number(process.env.MUSICBOX_COMPOSITE_REPETITIONS||1)||r.results.some(x=>x.browser!==process.env.MUSICBOX_COMPOSITE_BROWSERS||!x.actualSameProfilePlannerPlayback))process.exit(1)"
      - name: Verify native original entrance after rejecting a masked cue
        if: matrix.profile == 'Ste'
        run: node tests/composite-introduction.cjs > introduction-browser-result.json
      - name: Verify read-only offline inventory in real browser storage
        run: node tests/storage-browser.cjs > storage-browser-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: common-pcm-browser-proof-${{ matrix.profile }}-${{ matrix.browser }}
          path: |
            composite-browser-result.json
            introduction-browser-result.json
            storage-browser-result.json
            gstreamer-*.log
            linux-audio-output.txt
          retention-days: 14
