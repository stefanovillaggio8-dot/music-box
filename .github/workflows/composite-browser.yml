name: Common PCM mix Chromium and WebKit playback
on:
  pull_request:
    paths:
      - 'audio-composite-*.js'
      - 'audio-composite-*.mjs'
      - 'dj-mixes/**'
      - 'dj-deep-analysis.json'
      - 'app.js'
      - 'mix-intelligente.js'
      - 'tests/composite-*.cjs'
      - '.github/workflows/composite-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-decoders:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MUSICBOX_COMPOSITE_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium webkit
          node tests/native-decoder-peaks.cjs > native-decoder-peaks.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-decoder-${{ matrix.browser }}
          path: native-decoder-peaks.json
          retention-days: 14
  certify-index:
    needs: native-decoders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-decoder-*
          path: native-proofs
      - run: |
          mkdir certified
          node tools/apply-native-decoder-peaks.cjs --proofs=native-proofs --output=certified/dj-deep-analysis.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-certified-index
          path: certified/dj-deep-analysis.json
          retention-days: 14
  real-audio:
    needs: certify-index
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        profile: [Emanuele, Ste]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUSICBOX_COMPOSITE_BROWSERS: ${{ matrix.browser }}
      MUSICBOX_COMPOSITE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium webkit
      - uses: actions/download-artifact@v4
        with:
          name: native-certified-index
          path: .
      - run: node --test tests/composite-mix.test.cjs
      - run: |
          set -o pipefail
          node tests/composite-browser.cjs | tee composite-browser-result.json
          node -e "const r=require('./composite-browser-result.json');if(r.results.length!==1||r.results.some(x=>x.browser!==process.env.MUSICBOX_COMPOSITE_BROWSERS||!x.actualSameProfilePlannerPlayback))process.exit(1)"
      - name: Verify read-only offline inventory in real browser storage
        run: node tests/storage-browser.cjs > storage-browser-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: common-pcm-browser-proof-${{ matrix.profile }}-${{ matrix.browser }}
          path: |
            composite-browser-result.json
            storage-browser-result.json
          retention-days: 14
