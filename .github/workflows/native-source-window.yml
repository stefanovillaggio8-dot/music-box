name: Ste native source waveform capture (forensic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            browser: chromium
          - runner: ubuntu-latest
            browser: webkit
          - runner: macos-26-intel
            browser: webkit
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps ${{ matrix.browser }}
          node tools/export-native-source-window.cjs
        env:
          MUSICBOX_NATIVE_BROWSER: ${{ matrix.browser }}
          MUSICBOX_NATIVE_WINDOW_OUTPUT: native-window
      - uses: actions/upload-artifact@v4
        with:
          name: forensic-source-${{ matrix.runner }}-${{ matrix.browser }}
          path: native-window/
          retention-days: 14
