name: Ste research membership and budget contract
on:
  pull_request:
    paths:
      - 'tools/ste-research-scope.cjs'
      - 'tools/ste-native-clean-evaluation.cjs'
      - 'tools/build-native-clean-tail-candidate.cjs'
      - 'tests/native-clean-tail.test.cjs'
      - 'tests/native-clean-browser.cjs'
      - 'tools/simulate-library-listening.cjs'
      - 'tests/ste-research-scope.test.cjs'
      - 'tests/ste-metrical-diagnosis.test.cjs'
      - 'tests/context-bar-chains.test.cjs'
      - 'tools/context-bar-chains.cjs'
      - 'tools/diagnose-ste-metrical-pulses.cjs'
      - 'tools/build-preserved-tail-plans.cjs'
      - 'tools/dj-edge-grids.py'
      - 'tools/dj-structure-core.py'
      - 'tools/test-dj-whole-structure.py'
      - 'tools/test-dj-edge-cache.py'
      - '.github/workflows/ste-research-scope.yml'
      - '.github/workflows/dj-equivalence-audit.yml'
      - '.github/workflows/dj-pcm-transition-features.yml'
      - '.github/workflows/dj-structural-integration.yml'
      - '.github/workflows/dj-real-audio-audit.yml'
  workflow_dispatch:
    inputs:
      native_clean_evaluation:
        description: 'Read-only Ste clean-tail native decode experiment; never installs playback plans'
        type: boolean
        default: false
      native_clean_player:
        description: 'Actual-app Ste native-element SHADOW trial only; does not install or certify plans'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-clean-evaluation:
    if: github.event_name == 'workflow_dispatch' && (inputs.native_clean_evaluation || inputs.native_clean_player)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser backends
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium webkit
      - name: Provide Linux native media output
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=musicbox_eval rate=48000 channels=2
          pactl set-default-sink musicbox_eval
      - name: Fetch only the two current Ste originals with Git identity checks
        run: node tools/fetch-ste-clean-evaluation.cjs audits/ste-classifier-evaluation-20261123/candidate.json
      - name: Measure nominal clocks and original waveform at both sample rates
        if: inputs.native_clean_evaluation
        run: node tools/ste-native-clean-evaluation.cjs audits/ste-classifier-evaluation-20261123/candidate.json native-clean-evaluation.json
      - name: Exercise actual native element start and same-element adoption in the real app
        if: inputs.native_clean_player
        env:
          MUSICBOX_NATIVE_CLEAN_OUTPUT: native-clean-player.json
        run: |
          node --test tests/native-clean-tail.test.cjs tests/structural-plans.test.cjs tests/dj-shuffle-fallback.test.cjs
          node tests/native-clean-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ste-native-clean-evaluation-${{ runner.os }}
          path: |
            native-clean-evaluation.json
            native-clean-player.json
  personal-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ste-research-scope.test.cjs tests/ste-metrical-diagnosis.test.cjs tests/context-bar-chains.test.cjs tests/published-personal-catalog.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Metrical evidence and cache regression without audio or model downloads
        run: |
          python -m py_compile tools/dj-edge-grids.py tools/dj-structure-core.py
          python tools/test-dj-whole-structure.py
          python tools/test-dj-edge-cache.py
