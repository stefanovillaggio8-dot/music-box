name: Ste research membership and budget contract
on:
  pull_request:
    paths:
      - 'tools/ste-research-scope.cjs'
      - 'tools/simulate-library-listening.cjs'
      - 'tests/ste-research-scope.test.cjs'
      - 'tests/ste-metrical-diagnosis.test.cjs'
      - 'tools/diagnose-ste-metrical-pulses.cjs'
      - 'tools/build-preserved-tail-plans.cjs'
      - 'tools/dj-edge-grids.py'
      - 'tools/dj-structure-core.py'
      - 'tools/test-dj-whole-structure.py'
      - 'tools/test-dj-edge-cache.py'
      - '.github/workflows/ste-research-scope.yml'
      - '.github/workflows/dj-equivalence-audit.yml'
      - '.github/workflows/dj-pcm-transition-features.yml'
      - '.github/workflows/dj-structural-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  personal-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ste-research-scope.test.cjs tests/ste-metrical-diagnosis.test.cjs tests/published-personal-catalog.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Metrical evidence and cache regression without audio or model downloads
        run: |
          python -m py_compile tools/dj-edge-grids.py tools/dj-structure-core.py
          python tools/test-dj-whole-structure.py
          python tools/test-dj-edge-cache.py
