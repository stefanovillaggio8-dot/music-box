name: MusicBox
options:
  bundleIdPrefix: it.stefanovillaggio8
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: it.stefanovillaggio8.musicbox
    PRODUCT_NAME: MusicBox
    INFOPLIST_FILE: Sources/Info.plist
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Manual
targets:
  MusicBox:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.stefanovillaggio8.musicbox
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
